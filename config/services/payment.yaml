parameters: {}

services:
    _defaults:
        autowire: true
        autoconfigure: true
    _instanceof:
        App\Shared\Application\Bus\SyncCommandHandlerInterface:
            tags:
                - {name: messenger.message_handler, bus: sync.command.bus}

    App\Payment\Application\:
        resource: '../../src/Payment/Application/'
        exclude:
            - '../../src/Payment/Application/**/*Command.php'

    App\Payment\Infrastructure\:
        resource: '../../src/Payment/Infrastructure/'

    App\Payment\UI\:
        resource: '../../src/Payment/UI/'
        exclude:
            - '../../src/Payment/UI/**/*Request.php'

    App\Payment\Domain\Port\ProcessedWebhookEventRepositoryInterface:
        alias: App\Payment\Infrastructure\Persistence\DoctrineProcessedWebhookEventRepository

    App\Payment\Infrastructure\Security\HmacWebhookAuthenticator:
        arguments:
            $secret: '%env(PAYMENT_WEBHOOK_SECRET)%'

    bookit.doctrine.middleware.search_path.payment:
        class: App\Shared\Infrastructure\Doctrine\SearchPathMiddleware
        arguments:
            $schema: 'payment'
        tags:
            - {name: doctrine.middleware, connection: payment}
