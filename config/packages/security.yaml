security:
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        payment_webhooks:
            pattern: ^/api/v1/payment/webhooks
            stateless: true
            custom_authenticators:
                - App\Payment\Infrastructure\Security\HmacWebhookAuthenticator
        api:
            pattern: ^/
            stateless: true
            custom_authenticators:
                - App\Security\Infrastructure\Keycloak\BearerTokenAuthenticator

    access_control:
        - { path: ^/api/v1/payment/webhooks, roles: ROLE_WEBHOOK }
        - { path: ^/api/v1/search$, roles: PUBLIC_ACCESS, methods: [ GET ] }
        - { path: ^/api/v1/geo/places$, roles: PUBLIC_ACCESS, methods: [ GET ] }
        - { path: ^/api/v1/operators$, roles: ROLE_ADMIN, methods: [POST] }
        - { path: ^/, roles: ROLE_OPERATOR }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
