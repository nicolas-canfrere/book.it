nelmio_api_doc:
    documentation:
        info:
            title: Book.it
            description: Hotels management!
            version: 1.0.0
        components:
            schemas:
                ProblemDetail:
                    type: object
                    required: [type, title, status, detail]
                    properties:
                        type:
                            type: string
                            format: uri
                            example: 'about:blank'
                        title:
                            type: string
                            example: 'Conflict'
                        status:
                            type: integer
                            example: 409
                        detail:
                            type: string
                            example: 'A hotel named "Ibis" already exists in Paris.'
                ValidationProblemDetail:
                    allOf:
                        - $ref: '#/components/schemas/ProblemDetail'
                        - type: object
                          required: [violations]
                          properties:
                              violations:
                                  type: array
                                  items:
                                      type: object
                                      required: [field, message]
                                      properties:
                                          field:
                                              type: string
                                              example: name
                                          message:
                                              type: string
                                              example: 'This value should not be blank.'
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
