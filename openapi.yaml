openapi: 3.0.0
info:
  title: Book.it
  description: 'Hotels management!'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8080'
    description: 'Local development server'
paths:
  '/api/hotels/{id}':
    get:
      tags:
        - Hotels
      summary: 'Get a hotel by ID'
      operationId: get_hotel_get_hotel
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'Hotel found'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string, example: 'Hotel Ibis Paris' }
                  streetAddress: { type: string, example: '15 rue de Rivoli' }
                  postalCode: { type: string, example: '75001' }
                  city: { type: string, example: Paris }
                  country: { type: string, example: FR }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Hotel not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/hotels:
    get:
      tags:
        - Hotels
      summary: 'List hotels (paginated)'
      operationId: get_hotel_list_hotels
      parameters:
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
        -
          name: city
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
            maxLength: 255
            minLength: 1
        -
          name: country
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
      responses:
        '200':
          description: 'Paginated hotel catalogue'
          content:
            application/json:
              schema:
                properties:
                  data: { type: array, items: { properties: { id: { type: string, format: uuid }, name: { type: string }, streetAddress: { type: string }, postalCode: { type: string }, city: { type: string }, country: { type: string }, createdAt: { type: integer } }, type: object } }
                  meta: { properties: { page: { type: integer, example: 1 }, limit: { type: integer, example: 20 }, total: { type: integer, example: 143 }, totalPages: { type: integer, example: 8 } }, type: object }
                type: object
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
    post:
      tags:
        - Hotels
      summary: 'Register a new hotel'
      operationId: post_hotel_register_hotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterHotelRequest'
      responses:
        '201':
          description: 'Hotel registered'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string, example: 'Hotel Ibis Paris' }
                  streetAddress: { type: string, example: '15 rue de Rivoli' }
                  postalCode: { type: string, example: '75001' }
                  city: { type: string, example: Paris }
                  country: { type: string, example: FR }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 'Hotel already exists'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
  '/api/hotels/{hotelId}/rooms/batch':
    post:
      tags:
        - Rooms
      summary: 'Import multiple rooms in a hotel from a CSV file'
      operationId: post_room_batch_register_rooms
      parameters:
        -
          name: hotelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - csv
              properties:
                csv:
                  description: 'CSV file with "number,floor" header columns and one room per row'
                  type: string
                  format: binary
              type: object
      responses:
        '201':
          description: 'All rooms registered'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { id: { type: string, format: uuid }, hotelId: { type: string, format: uuid }, number: { type: string, example: '101' }, floor: { type: integer, example: 1 }, createdAt: { description: 'Unix timestamp', type: integer } }
                  type: object
        '404':
          description: 'Hotel not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Validation error (invalid CSV format or room constraint violations)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
  '/api/rooms/{id}':
    get:
      tags:
        - Rooms
      summary: 'Get a room by ID'
      operationId: get_room_get_room
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'Room found'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  hotelId: { type: string, format: uuid }
                  number: { type: string, example: '101' }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Room not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  '/api/hotels/{hotelId}/rooms':
    get:
      tags:
        - Rooms
      summary: 'List rooms of a hotel (paginated)'
      operationId: get_room_list_rooms
      parameters:
        -
          name: hotelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: 'Paginated room catalogue'
          content:
            application/json:
              schema:
                properties:
                  data: { type: array, items: { properties: { id: { type: string, format: uuid }, hotelId: { type: string, format: uuid }, number: { type: string }, createdAt: { type: integer } }, type: object } }
                  meta: { properties: { page: { type: integer, example: 1 }, limit: { type: integer, example: 20 }, total: { type: integer, example: 10 }, totalPages: { type: integer, example: 1 } }, type: object }
                type: object
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
    post:
      tags:
        - Rooms
      summary: 'Register a new room in a hotel'
      operationId: post_room_register_room
      parameters:
        -
          name: hotelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRoomRequest'
      responses:
        '201':
          description: 'Room registered'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  hotelId: { type: string, format: uuid }
                  number: { type: string, example: '101' }
                  floor: { type: integer, example: 1 }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Hotel not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 'Room already exists'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
  '/api/bookers/{id}':
    get:
      tags:
        - Bookers
      summary: 'Get a booker by ID'
      operationId: get_booker_get_booker
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'Booker found'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  firstName: { type: string, example: Jane }
                  lastName: { type: string, example: Doe }
                  email: { type: string, format: email, example: jane.doe@example.com }
                  phone: { type: string, example: '+33612345678' }
                  dateOfBirth: { type: string, format: date, example: '1990-01-15' }
                  registeredAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Booker not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/bookers:
    post:
      tags:
        - Bookers
      summary: 'Register a new booker'
      operationId: post_booker_register_booker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBookerRequest'
      responses:
        '201':
          description: 'Booker registered'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  firstName: { type: string, example: Jean }
                  lastName: { type: string, example: Dupont }
                  email: { type: string, format: email, example: jean.dupont@example.com }
                  phone: { type: string, example: '+33612345678' }
                  dateOfBirth: { type: string, format: date, example: '1990-05-15' }
                  registeredAt: { description: 'Unix timestamp', type: integer }
                type: object
        '409':
          description: 'Email already taken'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Validation error or underage applicant'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
        '404':
          description: 'Not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  '/api/rooms/{roomId}/blocked-periods':
    get:
      tags:
        - Availability
      summary: 'Get all blocked periods for a room'
      operationId: get_availability_get_calendar
      parameters:
        -
          name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'Availability calendar'
          content:
            application/json:
              schema:
                properties:
                  blockedPeriods: { type: array, items: { properties: { id: { type: string, format: uuid }, roomId: { type: string, format: uuid }, checkIn: { type: string, format: date, example: '2025-06-10' }, checkOut: { type: string, format: date, example: '2025-06-13' }, createdAt: { type: integer } }, type: object } }
                type: object
    post:
      tags:
        - Availability
      summary: 'Block a period for a room'
      operationId: post_availability_block_period
      parameters:
        -
          name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockPeriodRequest'
      responses:
        '201':
          description: 'Period blocked'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  roomId: { type: string, format: uuid }
                  checkIn: { type: string, format: date, example: '2025-06-10' }
                  checkOut: { type: string, format: date, example: '2025-06-13' }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Room not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 'Period overlaps existing block'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
  '/api/rooms/{roomId}/availability':
    get:
      tags:
        - Availability
      summary: 'Check whether a room is available for a given period'
      operationId: get_availability_check
      parameters:
        -
          name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
        -
          name: checkIn
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
        -
          name: checkOut
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
      responses:
        '200':
          description: 'Availability result'
          content:
            application/json:
              schema:
                properties:
                  available: { type: boolean }
                type: object
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
  '/api/blocked-periods/{id}':
    delete:
      tags:
        - Availability
      summary: 'Delete a blocked period'
      operationId: delete_availability_delete_blocked_period
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '204':
          description: 'Blocked period deleted'
        '404':
          description: 'Blocked period not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  '/api/rooms/{roomId}/rate-periods':
    get:
      tags:
        - Pricing
      summary: 'Get rate periods for a room'
      operationId: get_pricing_get_rate_periods
      parameters:
        -
          name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'List of rate periods'
          content:
            application/json:
              schema:
                properties:
                  ratePeriods: { type: array, items: { properties: { id: { type: string, format: uuid }, roomId: { type: string, format: uuid }, checkIn: { type: string, format: date, example: '2025-07-01' }, checkOut: { type: string, format: date, example: '2025-08-31' }, amountCents: { type: integer, example: 15000 }, createdAt: { description: 'Unix timestamp', type: integer } }, type: object } }
                type: object
    post:
      tags:
        - Pricing
      summary: 'Create a rate period for a room'
      operationId: post_pricing_create_rate_period
      parameters:
        -
          name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatePeriodRequest'
      responses:
        '201':
          description: 'Rate period created'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  roomId: { type: string, format: uuid }
                  checkIn: { type: string, format: date, example: '2025-07-01' }
                  checkOut: { type: string, format: date, example: '2025-08-31' }
                  amountCents: { type: integer, example: 15000 }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Room not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 'Period overlaps existing rate period'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
  '/api/rooms/{roomId}/rate-periods/{ratePeriodId}':
    put:
      tags:
        - Pricing
      summary: 'Update a rate period for a room'
      operationId: put_pricing_update_rate_period
      parameters:
        -
          name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
        -
          name: ratePeriodId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRatePeriodRequest'
      responses:
        '200':
          description: 'Rate period updated'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  roomId: { type: string, format: uuid }
                  checkIn: { type: string, format: date, example: '2025-07-01' }
                  checkOut: { type: string, format: date, example: '2025-09-01' }
                  amountCents: { type: integer, example: 16000 }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Rate period not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 'Period overlaps existing rate period'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
    delete:
      tags:
        - Pricing
      summary: 'Delete a rate period'
      operationId: delete_pricing_delete_rate_period
      parameters:
        -
          name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
        -
          name: ratePeriodId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '204':
          description: 'Rate period deleted'
        '404':
          description: 'Rate period not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  '/api/rooms/{roomId}/base-rate':
    get:
      tags:
        - Pricing
      summary: 'Get the base rate for a room'
      operationId: get_pricing_get_base_rate
      parameters:
        -
          name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'Base rate retrieved'
          content:
            application/json:
              schema:
                properties:
                  roomId: { type: string, format: uuid }
                  amountCents: { type: integer, example: 12000 }
                  updatedAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Room not found or base rate not configured'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags:
        - Pricing
      summary: 'Set the base rate for a room'
      operationId: put_pricing_set_base_rate
      parameters:
        -
          name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBaseRateRequest'
      responses:
        '200':
          description: 'Base rate set'
          content:
            application/json:
              schema:
                properties:
                  roomId: { type: string, format: uuid }
                  amountCents: { type: integer, example: 12000 }
                  updatedAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Room not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
components:
  schemas:
    ProblemDetail:
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: 'about:blank'
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: 'A hotel named "Ibis" already exists in Paris.'
      type: object
    ValidationProblemDetail:
      allOf:
        -
          $ref: '#/components/schemas/ProblemDetail'
        -
          required:
            - violations
          properties:
            violations:
              type: array
              items:
                required:
                  - field
                  - message
                properties:
                  field: { type: string, example: name }
