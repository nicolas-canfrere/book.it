components:
  schemas:
    ProblemDetail:
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: 'about:blank'
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: 'A hotel named "Ibis" already exists in Paris.'
      type: object
    ValidationProblemDetail:
      allOf:
        -
          $ref: '#/components/schemas/ProblemDetail'
        -
          required:
            - violations
          properties:
            violations:
              type: array
              items:
                required:
                  - field
                  - message
                properties:
                  field: { type: string, example: name }
                  message: { type: string, example: 'This value should not be blank.' }
                type: object
          type: object
    ClassifyHotelRequest:
      properties:
        stars:
          type: integer
          example: 4
          nullable: true
          default: null
          maximum: 5
          minimum: 1
        superior:
          type: boolean
          example: false
          default: false
      type: object
    ListHotelsRequest:
      properties:
        page:
          type: integer
          default: 1
          minimum: 1
        limit:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
        city:
          type: string
          nullable: true
          default: null
          maxLength: 255
          minLength: 1
        country:
          type: string
          nullable: true
          default: null
        minStars:
          type: integer
          nullable: true
          default: null
          maximum: 5
          minimum: 1
      type: object
    RegisterHotelRequest:
      properties:
        name:
          type: string
          example: 'Hotel Ibis Paris'
          nullable: true
          default: null
          maxLength: 255
          minLength: 2
        streetAddress:
          type: string
          example: '15 rue de Rivoli'
          nullable: true
          default: null
          maxLength: 255
          minLength: 2
        postalCode:
          type: string
          example: '75001'
          nullable: true
          default: null
          maxLength: 20
          minLength: 1
        city:
          type: string
          example: Paris
          nullable: true
          default: null
          maxLength: 255
          minLength: 1
        country:
          type: string
          example: FR
          nullable: true
          default: null
          maxLength: 2
          minLength: 2
        stars:
          type: integer
          example: 4
          nullable: true
          default: null
          maximum: 5
          minimum: 1
        superior:
          type: boolean
          example: false
          default: false
      type: object
    ListRoomTypesRequest:
      properties:
        page:
          type: integer
          default: 1
          minimum: 1
        limit:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      type: object
    ListRoomsRequest:
      properties:
        page:
          type: integer
          default: 1
          minimum: 1
        limit:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      type: object
    RegisterRoomRequest:
      properties:
        number:
          type: string
          example: '101'
          nullable: true
          default: null
          maxLength: 50
          minLength: 1
        floor:
