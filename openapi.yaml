openapi: 3.0.0
info:
  title: Book.it
  description: 'Hotels management!'
  version: 1.0.0
paths:
  '/api/hotels/{id}':
    get:
      tags:
        - Hotels
      summary: 'Get a hotel by ID'
      operationId: get_hotel_get_hotel
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'Hotel found'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string, example: 'Hotel Ibis Paris' }
                  streetAddress: { type: string, example: '15 rue de Rivoli' }
                  postalCode: { type: string, example: '75001' }
                  city: { type: string, example: Paris }
                  country: { type: string, example: FR }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Hotel not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/hotels:
    get:
      tags:
        - Hotels
      summary: 'List hotels (paginated)'
      operationId: get_hotel_list_hotels
      parameters:
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
        -
          name: city
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
            maxLength: 255
            minLength: 1
        -
          name: country
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
      responses:
        '200':
          description: 'Paginated hotel catalogue'
          content:
            application/json:
              schema:
                properties:
                  data: { type: array, items: { properties: { id: { type: string, format: uuid }, name: { type: string }, streetAddress: { type: string }, postalCode: { type: string }, city: { type: string }, country: { type: string }, createdAt: { type: integer } }, type: object } }
                  meta: { properties: { page: { type: integer, example: 1 }, limit: { type: integer, example: 20 }, total: { type: integer, example: 143 }, totalPages: { type: integer, example: 8 } }, type: object }
                type: object
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
    post:
      tags:
        - Hotels
      summary: 'Register a new hotel'
      operationId: post_hotel_register_hotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterHotelRequest'
      responses:
        '201':
          description: 'Hotel registered'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string, example: 'Hotel Ibis Paris' }
                  streetAddress: { type: string, example: '15 rue de Rivoli' }
                  postalCode: { type: string, example: '75001' }
                  city: { type: string, example: Paris }
                  country: { type: string, example: FR }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 'Hotel already exists'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
  '/api/rooms/{id}':
    get:
      tags:
        - Rooms
      summary: 'Get a room by ID'
      operationId: get_room_get_room
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'Room found'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  hotelId: { type: string, format: uuid }
                  number: { type: string, example: '101' }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Room not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  '/api/hotels/{hotelId}/rooms':
    get:
      tags:
        - Rooms
      summary: 'List rooms of a hotel (paginated)'
      operationId: get_room_list_rooms
      parameters:
        -
          name: hotelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: 'Paginated room catalogue'
          content:
            application/json:
              schema:
                properties:
                  data: { type: array, items: { properties: { id: { type: string, format: uuid }, hotelId: { type: string, format: uuid }, number: { type: string }, createdAt: { type: integer } }, type: object } }
                  meta: { properties: { page: { type: integer, example: 1 }, limit: { type: integer, example: 20 }, total: { type: integer, example: 10 }, totalPages: { type: integer, example: 1 } }, type: object }
                type: object
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
    post:
      tags:
        - Rooms
      summary: 'Register a new room in a hotel'
      operationId: post_room_register_room
      parameters:
        -
          name: hotelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRoomRequest'
      responses:
        '201':
          description: 'Room registered'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  hotelId: { type: string, format: uuid }
                  number: { type: string, example: '101' }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '404':
          description: 'Hotel not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: 'Room already exists'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Validation error'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
components:
  schemas:
    ProblemDetail:
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: 'about:blank'
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: 'A hotel named "Ibis" already exists in Paris.'
      type: object
    ValidationProblemDetail:
      allOf:
        -
          $ref: '#/components/schemas/ProblemDetail'
        -
          required:
            - violations
          properties:
            violations:
              type: array
              items:
                required:
                  - field
                  - message
                properties:
                  field: { type: string, example: name }
                  message: { type: string, example: 'This value should not be blank.' }
                type: object
          type: object
    ListHotelsRequest:
      properties:
        page:
          type: integer
          default: 1
          minimum: 1
        limit:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
        city:
          type: string
          nullable: true
          default: null
          maxLength: 255
          minLength: 1
        country:
          type: string
          nullable: true
          default: null
      type: object
    RegisterHotelRequest:
      properties:
        name:
          type: string
          example: 'Hotel Ibis Paris'
          nullable: true
          default: null
          maxLength: 255
          minLength: 2
        streetAddress:
          type: string
          example: '15 rue de Rivoli'
          nullable: true
          default: null
          maxLength: 255
          minLength: 2
        postalCode:
          type: string
          example: '75001'
          nullable: true
          default: null
          maxLength: 20
          minLength: 1
        city:
          type: string
          example: Paris
          nullable: true
          default: null
          maxLength: 255
          minLength: 1
        country:
          type: string
          example: FR
          nullable: true
          default: null
          maxLength: 2
          minLength: 2
      type: object
    ListRoomsRequest:
      properties:
        page:
          type: integer
          default: 1
          minimum: 1
        limit:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      type: object
    RegisterRoomRequest:
      properties:
        number:
          type: string
          example: '101'
          nullable: true
          default: null
          maxLength: 50
          minLength: 1
      type: object
tags:
  -
    name: Hotels
    description: Hotels
  -
    name: Rooms
    description: Rooms

