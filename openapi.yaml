openapi: 3.0.0
info:
  title: Book.it
  description: 'Hotels management!'
  version: 1.0.0
paths:
  /api/hotels:
    post:
      tags:
        - Hotels
      summary: 'Register a new hotel'
      operationId: post_hotel_register_hotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterHotelRequest'
      responses:
        '201':
          description: 'Hotel registered'
          content:
            application/json:
              schema:
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string, example: 'Hotel Ibis Paris' }
                  streetAddress: { type: string, example: '15 rue de Rivoli' }
                  postalCode: { type: string, example: '75001' }
                  city: { type: string, example: Paris }
                  country: { type: string, example: FR }
                  createdAt: { description: 'Unix timestamp', type: integer }
                type: object
        '409':
          description: 'Hotel already exists'
        '422':
          description: 'Validation error'
components:
  schemas:
    RegisterHotelRequest:
      required:
        - name
        - streetAddress
        - postalCode
        - city
        - country
      properties:
        name:
          type: string
          example: 'Hotel Ibis Paris'
          maxLength: 255
          minLength: 2
        streetAddress:
          type: string
          example: '15 rue de Rivoli'
          maxLength: 255
          minLength: 2
        postalCode:
          type: string
          example: '75001'
          maxLength: 20
          minLength: 1
        city:
          type: string
          example: Paris
          maxLength: 255
          minLength: 1
        country:
          type: string
          example: FR
          maxLength: 2
          minLength: 2
      type: object
tags:
  -
    name: Hotels
    description: Hotels

