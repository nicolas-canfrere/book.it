deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*[Tt]est.*#'
    layers:
        -
            name: UI
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: classLike
                            value: 'App\\.*\\UI\\.*'
                    must_not:
                        -
                            type: classLike
                            value: 'App\\Shared\\.*'
        -
            name: Application
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: classLike
                            value: 'App\\.*\\Application\\.*'
                    must_not:
                        -
                            type: classLike
                            value: 'App\\Shared\\.*'
        -
            name: Domain
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: classLike
                            value: 'App\\.*\\Domain\\.*'
                    must_not:
                        -
                            type: classLike
                            value: 'App\\Shared\\.*'
        -
            name: Infrastructure
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: classLike
                            value: 'App\\.*\\Infrastructure\\.*'
                    must_not:
                        -
                            type: classLike
                            value: 'App\\Shared\\.*'
        -
            name: Shared
            collectors:
                -
                    type: classLike
                    value: 'App\\Shared\\.*'
        -
            name: ExternalPsr
            collectors:
                -
                    type: classLike
                    value: 'Psr\\.*'
        -
            name: External
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: classLike
                            value: '.*\\.*'
                    must_not:
                        -
                            type: classLike
                            value: 'App\\.*'
                        -
                            type: classLike
                            value: 'Psr\\.*'
    ruleset:
        UI:
            - Application
            - Domain
            - Shared
            - ExternalPsr
            - External
        Application:
            - Domain
            - Shared
            - ExternalPsr
        Domain:
            - Shared
        Infrastructure:
            - Application
            - Domain
            - Shared
            - ExternalPsr
            - External
        Shared:
            - ExternalPsr
            - External
        ExternalPsr: ~
        External: ~
    skip_violations:
        App\Shared\Infrastructure\Http\TenantContextMiddleware:
            - App\Security\Infrastructure\Keycloak\OperatorUser
