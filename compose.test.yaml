services:

  php-test:
    image: ${PHP_IMAGE}
    container_name: bookit-php-test
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
      - .env.test
    depends_on:
      database-test:
        condition: service_healthy

  database-test:
    image: ${DB_IMAGE:-postgres:latest}
    container_name: bookit-database-test
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
