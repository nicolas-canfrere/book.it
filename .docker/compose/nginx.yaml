services:
    nginx:
        image: ${NGINX_IMAGE:-nginx:latest}
        container_name: ${NGINX_CONTAINER_NAME:-nginx-dev}
        ports:
            - "${NGINX_PORT:-8080}:80"
        volumes:
            - ./../../:/app
            - ../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
        depends_on: ["${PHP_SERVICE_NAME:-php}"]
        networks:
            - ${NETWORK_NAME:-default-nw}
