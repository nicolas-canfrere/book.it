services:
    database:
        image: ${DB_IMAGE:-postgres:latest}
        container_name: ${DB_CONTAINER_NAME:-database-dev}
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
        ports:
            - "${DB_PORT:-5432}:5432"
        healthcheck:
            test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB:-postgres}", "-U", "${POSTGRES_USER:-postgres}" ]
            timeout: 5s
            retries: 5
            start_period: 60s
        volumes:
            - database_data:/var/lib/postgresql/data:rw
        networks:
            - ${NETWORK_NAME:-default-nw}

volumes:
    database_data:
